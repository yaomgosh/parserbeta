<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WB Capture</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="panel">
      <header class="header">
        <div>
          <h1>WB Capture</h1>
          <p id="status">Проверяю вкладку...</p>
        </div>
        <div class="counter" title="Найдено ссылок">
          <span id="count">0</span>
        </div>
      </header>

      <section class="actions">
        <button id="start" type="button">Start capture</button>
        <button id="stop" type="button">Stop</button>
      </section>

      <section class="actions secondary">
        <button id="export" type="button">Export CSV</button>
        <button id="clear" type="button">Clear</button>
      </section>

      <p class="hint">
        Открой страницу Wildberries, нажми Start capture и скролль вручную.
      </p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
